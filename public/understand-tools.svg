<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Illustration of web development tools">
  <defs>
    <radialGradient id="glow" cx="80%" cy="0%" r="85%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#1d4ed8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#06162e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8ab9ff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#8ab9ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#123463"/>
      <stop offset="100%" stop-color="#0c2344"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#8ab9ff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1d3a63" stroke-width="1" opacity="0.45"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000814" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1280" height="720" fill="#06162e"/>
  <rect width="1280" height="720" fill="url(#glow)"/>
  <rect width="1280" height="720" fill="url(#grid)" opacity="0.7"/>
  <circle cx="640" cy="355" r="320" fill="url(#hubGlow)"/>

  <!-- connecting lines -->
  <g stroke="#2f5f9f" stroke-width="2" stroke-dasharray="7 9" opacity="0.8">
    <path d="M470 360 C360 360 300 300 230 250"/>
    <path d="M810 350 C920 350 980 290 1040 240"/>
    <path d="M800 430 C910 470 960 520 1040 560"/>
    <path d="M470 440 C370 490 320 540 240 570"/>
  </g>

  <!-- central browser window -->
  <g filter="url(#shadow)">
    <rect x="430" y="215" width="420" height="290" rx="22" fill="url(#panel)" stroke="#2f5f9f" stroke-width="2"/>
    <rect x="430" y="215" width="420" height="58" rx="22" fill="#16345e"/>
    <rect x="430" y="250" width="420" height="23" fill="#16345e"/>
    <circle cx="464" cy="244" r="7" fill="#8ab9ff" opacity="0.9"/>
    <circle cx="489" cy="244" r="7" fill="#3b6db5"/>
    <circle cx="514" cy="244" r="7" fill="#2b4c7d"/>
    <rect x="552" y="237" width="250" height="14" rx="7" fill="#0c2344" opacity="0.9"/>
    <!-- code lines -->
    <g stroke-linecap="round">
      <rect x="462" y="300" width="118" height="12" rx="6" fill="url(#accent)"/>
      <rect x="590" y="300" width="196" height="12" rx="6" fill="#3b6db5" opacity="0.85"/>
      <rect x="486" y="332" width="82" height="12" rx="6" fill="#8ab9ff" opacity="0.65"/>
      <rect x="578" y="332" width="146" height="12" rx="6" fill="#3b6db5" opacity="0.7"/>
      <rect x="486" y="364" width="154" height="12" rx="6" fill="#2563eb" opacity="0.85"/>
      <rect x="650" y="364" width="92" height="12" rx="6" fill="#3b6db5" opacity="0.6"/>
      <rect x="510" y="396" width="104" height="12" rx="6" fill="#8ab9ff" opacity="0.55"/>
      <rect x="462" y="428" width="70" height="12" rx="6" fill="#3b6db5"/>
      <rect x="542" y="428" width="180" height="12" rx="6" fill="#1d3a63"/>
    </g>
  </g>

  <!-- Docker-style container stack (left) -->
  <g filter="url(#shadow)">
    <rect x="120" y="250" width="112" height="34" rx="7" fill="#16345e" stroke="#2f5f9f" stroke-width="2"/>
    <rect x="120" y="282" width="112" height="34" rx="7" fill="#123463" stroke="#2f5f9f" stroke-width="2"/>
    <rect x="120" y="314" width="112" height="34" rx="7" fill="#0c2344" stroke="#2f5f9f" stroke-width="2"/>
    <g fill="#8ab9ff" opacity="0.85">
      <rect x="136" y="261" width="12" height="12" rx="2"/>
      <rect x="136" y="293" width="12" height="12" rx="2"/>
      <rect x="136" y="325" width="12" height="12" rx="2"/>
    </g>
    <g fill="#3b6db5">
      <rect x="156" y="262" width="60" height="10" rx="5"/>
      <rect x="156" y="294" width="48" height="10" rx="5"/>
      <rect x="156" y="326" width="56" height="10" rx="5"/>
    </g>
  </g>
  <circle cx="176" cy="220" r="9" fill="#8ab9ff" opacity="0.5"/>

  <!-- terminal (bottom left) -->
  <g filter="url(#shadow)">
    <rect x="140" y="480" width="180" height="112" rx="14" fill="#0c2344" stroke="#2f5f9f" stroke-width="2"/>
    <circle cx="162" cy="503" r="5" fill="#8ab9ff"/>
    <circle cx="180" cy="503" r="5" fill="#3b6db5"/>
    <circle cx="198" cy="503" r="5" fill="#2b4c7d"/>
    <rect x="160" y="526" width="10" height="12" rx="2" fill="#8ab9ff"/>
    <rect x="178" y="526" width="86" height="12" rx="6" fill="#3b6db5"/>
    <rect x="160" y="551" width="10" height="12" rx="2" fill="#8ab9ff"/>
    <rect x="178" y="551" width="60" height="12" rx="6" fill="#2f5f9f"/>
  </g>

  <!-- shield / security (top right) -->
  <g filter="url(#shadow)">
    <path d="M1040 150 L1108 174 V226 C1108 268 1078 292 1040 306 C1002 292 972 268 972 226 V174 Z"
          fill="url(#panel)" stroke="#8ab9ff" stroke-width="3"/>
    <path d="M1018 226 L1034 243 L1066 207" fill="none" stroke="url(#accent)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- gear / scaling (bottom right) -->
  <g filter="url(#shadow)" transform="translate(1040 560)">
    <path d="M0 -46 L12 -43 L17 -32 L30 -27 L42 -34 L52 -24 L45 -12 L50 1 L62 8 L58 22 L45 22 L38 33 L42 45 L30 52 L21 43 L8 48 L0 60 L-12 55 L-15 43 L-28 36 L-40 41 L-50 30 L-43 18 L-48 6 L-60 0 L-56 -14 L-43 -14 L-36 -26 L-40 -38 L-28 -46 L-18 -38 L-6 -44 Z"
          fill="#0c2344" stroke="#2f5f9f" stroke-width="2"/>
    <circle r="22" fill="#16345e" stroke="#8ab9ff" stroke-width="3"/>
    <circle r="8" fill="url(#accent)"/>
  </g>

  <!-- document pages (right middle) -->
  <g filter="url(#shadow)">
    <rect x="880" y="330" width="86" height="104" rx="10" fill="#0c2344" stroke="#2f5f9f" stroke-width="2" transform="rotate(8 923 382)"/>
    <rect x="900" y="320" width="86" height="104" rx="10" fill="url(#panel)" stroke="#8ab9ff" stroke-width="2"/>
    <g fill="#3b6db5">
      <rect x="916" y="344" width="52" height="8" rx="4"/>
      <rect x="916" y="364" width="44" height="8" rx="4"/>
      <rect x="916" y="384" width="50" height="8" rx="4"/>
    </g>
  </g>

  <!-- small sparkles -->
  <g fill="#8ab9ff" opacity="0.75">
    <circle cx="330" cy="160" r="4"/>
    <circle cx="930" cy="140" r="3"/>
    <circle cx="620" cy="610" r="4"/>
    <circle cx="760" cy="150" r="3"/>
  </g>
</svg>
